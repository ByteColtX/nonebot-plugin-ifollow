# release-skills 配置：只约定生成 CHANGELOG 所需的信息。
# 版本提升、提交与签名标签由 bump-my-version 执行（见 pyproject.toml 的 [tool.bumpversion]），
# 不要让 release-skills 自己创建提交或标签，否则会和 bump-my-version 的约定分叉。

version:
  file: pyproject.toml
  path: project.version

changelog:
  files:
    - path: CHANGELOG.md
      lang: zh

  # conventional commit 类型 → CHANGELOG 小节标题；chore 不进入变更日志。
  sections:
    feat: 新功能
    fix: 修复
    docs: 文档
    refactor: 重构
    perf: 性能优化
    test: 测试
    build: 构建
    ci: 持续集成
    style: 其他
    chore: null

# 仅用于回填历史 Release 时归一化标签名。
tag:
  prefix: v
