# release-skills 配置：仓库发布流程的约定。
# 实际的版本提升与打标签由 bump-my-version 执行（见 pyproject.toml 的 [tool.bumpversion]），
# 本文件让 release-skills 按同一套约定生成 CHANGELOG 与发布说明。

version:
  file: pyproject.toml
  path: project.version

changelog:
  files:
    - path: CHANGELOG.md
      lang: zh

  # conventional commit 类型 → CHANGELOG 小节标题；chore 不进入变更日志。
  sections:
    feat: 新功能
    fix: 修复
    docs: 文档
    refactor: 重构
    perf: 性能优化
    test: 测试
    build: 构建
    ci: 持续集成
    style: 其他
    chore: null

# bump-my-version 使用同一句模板（current_version / new_version 由它展开）。
commit:
  message: "chore(release): 将版本从 {current_version} 更新至 {new_version}"

tag:
  prefix: v
  sign: true

include:
  - pyproject.toml
  - uv.lock
  - CHANGELOG.md
