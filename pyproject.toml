[project]
name = "nonebot-plugin-ifollow"
version = "2.0.2"
description = "NoneBot2 多平台作者更新订阅插件"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ByteColtX", email = "umk@live.com" }]
dependencies = [
  "bilibili-api-python>=17.4.2,<18.0.0",
  "gmssl>=3.2.2,<4.0.0",
  "httpx>=0.27.0,<1.0.0",
  "nonebot-adapter-onebot>=2.4.6,<3.0.0",
  "nonebot-plugin-alconna>=0.60.0,<1.0.0",
  "nonebot-plugin-localstore>=0.7.4,<1.0.0",
  "nonebot2>=2.5.0,<3.0.0",
  "parsehub>=2.3.10,<3.0.0",
  "pydantic>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/ByteColtX/nonebot-plugin-ifollow"
Issues = "https://github.com/ByteColtX/nonebot-plugin-ifollow/issues"
Repository = "https://github.com/ByteColtX/nonebot-plugin-ifollow.git"

[dependency-groups]
dev = [
  "basedpyright>=1.31.0,<2.0.0",
  "bump-my-version>=1.2.7",
  "nonebot2[fastapi]>=2.5.0,<3.0.0",
  "poethepoet>=0.42.1",
  "pytest>=9.0.2,<10.0.0",
  "pytest-asyncio>=1.3.0,<1.4.0",
  "pytest-cov>=7.0.0",
  "pytest-xdist>=3.8.0,<4.0.0",
  "ruff>=0.15.2,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
wheel-exclude = ["*.SPEC.md"]  # SPEC 是维护者文档，只留在源码里

[tool.nonebot]
plugins = ["nonebot_plugin_ifollow"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.poe.tasks]
test = "pytest --cov=src --cov-report=xml --junitxml=./junit.xml -n auto"
bump = "bump-my-version bump"
show-bump = "bump-my-version show-bump"

[tool.bumpversion]
current_version = "2.0.2"
commit = true
message = "chore(release): 将版本从 {current_version} 更新至 {new_version}"
tag = true

[[tool.bumpversion.files]]
filename = "uv.lock"
search = "name = \"nonebot-plugin-ifollow\"\nversion = \"{current_version}\""
replace = "name = \"nonebot-plugin-ifollow\"\nversion = \"{new_version}\""

[tool.pytest]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "C4", "PT", "RUF"]
ignore = ["E402", "UP037", "RUF001", "RUF002", "RUF003"]
